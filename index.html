<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitGame AI</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Telegram API birinchi yuklanishi shart -->
    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- PROFILE PAGE -->
    <div id="profile" class="page active">
        <h2>FITGAME PLAYER</h2>
        <div class="character-container">
            <div class="hero" id="game-hero" data-tier="novice">
                <div class="hero__rays"></div>
                <div class="hero__aura"></div>
                <div class="hero__spark hero__spark--1"></div>
                <div class="hero__spark hero__spark--2"></div>
                <div class="hero__spark hero__spark--3"></div>
                <div class="hero__spark hero__spark--4"></div>
                <svg class="hero__svg" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#3a4552"/>
                            <stop offset="100%" stop-color="#12161c"/>
                        </linearGradient>
                        <linearGradient id="helmetGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#eef2f6"/>
                            <stop offset="100%" stop-color="#a3adb8"/>
                        </linearGradient>
                    </defs>
                    <!-- Qanotlar (faqat LEGEND) -->
                    <path class="hero-wing hero-wing--left" d="M62,88 Q14,72 2,118 Q14,108 28,114 Q8,138 14,168 Q28,148 38,142 Q24,172 34,192 Q48,158 58,138 Q60,112 62,88 Z"/>
                    <path class="hero-wing hero-wing--right" d="M138,88 Q186,72 198,118 Q186,108 172,114 Q192,138 186,168 Q172,148 162,142 Q176,172 166,192 Q152,158 142,138 Q140,112 138,88 Z"/>
                    <!-- Plash (faqat LEGEND) -->
                    <path class="hero-cape hero-cape--left" d="M64,72 Q34,142 52,238 Q70,196 78,150 Z"/>
                    <path class="hero-cape hero-cape--right" d="M136,72 Q166,142 148,238 Q130,196 122,150 Z"/>
                    <!-- Oyoqlar -->
                    <path class="hero-leg" fill="url(#suitGrad)" d="M80,146 L96,146 L93,224 L75,224 Z"/>
                    <path class="hero-leg" fill="url(#suitGrad)" d="M120,146 L104,146 L107,224 L125,224 Z"/>
                    <rect class="hero-boot" fill="url(#suitGrad)" x="65" y="221" width="31" height="18" rx="6"/>
                    <rect class="hero-boot" fill="url(#suitGrad)" x="104" y="221" width="31" height="18" rx="6"/>
                    <!-- Qo'llar -->
                    <path class="hero-arm hero-arm--left" fill="url(#suitGrad)" d="M64,78 Q40,102 38,150 Q37,161 48,161 Q57,161 56,150 Q59,110 76,84 Z"/>
                    <path class="hero-arm hero-arm--right" fill="url(#suitGrad)" d="M136,78 Q160,102 162,150 Q163,161 152,161 Q143,161 144,150 Q141,110 124,84 Z"/>
                    <circle class="hero-fist" cx="46" cy="156" r="12"/>
                    <circle class="hero-fist" cx="154" cy="156" r="12"/>
                    <!-- Energiya qilich (WARRIOR va LEGEND) -->
                    <path class="hero-weapon" d="M148,158 L154,46 L160,158 Z"/>
                    <!-- Tana -->
                    <path class="hero-torso" fill="url(#suitGrad)" d="M62,72 Q62,63 72,63 L128,63 Q138,63 138,72 L134,142 Q133,152 122,152 L78,152 Q67,152 66,142 Z"/>
                    <!-- Elka zirhlari (FIGHTER dan boshlab) -->
                    <ellipse class="hero-armor hero-armor--left" cx="58" cy="74" rx="17" ry="15"/>
                    <ellipse class="hero-armor hero-armor--right" cx="142" cy="74" rx="17" ry="15"/>
                    <!-- Ko'krak zirhi (WARRIOR va LEGEND) -->
                    <path class="hero-chestplate" d="M78,68 L122,68 L118,110 L100,118 L82,110 Z"/>
                    <!-- Energiya yadrosi (hamma darajada bor, yorqinligi o'sadi) -->
                    <circle class="hero-core" cx="100" cy="100" r="13"/>
                    <!-- Bo'yin va bosh -->
                    <rect class="hero-neck" fill="url(#suitGrad)" x="91" y="56" width="18" height="12" rx="3"/>
                    <circle class="hero-head" fill="url(#helmetGrad)" cx="100" cy="36" r="25"/>
                    <rect class="hero-visor" x="79" y="30" width="42" height="10" rx="5"/>
                    <!-- Toj (faqat LEGEND) -->
                    <path class="hero-crown" d="M76,12 L86,25 L100,8 L114,25 L124,12 L120,29 L80,29 Z"/>
                </svg>
            </div>
            <div class="character-stage"></div>
        </div>
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between;">
                <span id="lvl-display">LVL: 01</span>
                <span id="rank-display">RANK: NOVICE</span>
            </div>
            <div class="level-bar"><div class="level-progress" id="progress-bar" style="width: 0%;"></div></div>
            <p id="xp-display">XP: 0 / 1000</p>
        </div>
    </div>

    <!-- WORKOUT PAGE (AI KAMERA BILAN) -->
    <div id="workout" class="page">
        <h2>SQUAT MODE</h2>

        <!-- Kamera ko'rinishi -->
        <div class="camera-container">
            <!-- MUHIM TUZATISH: display:none iOS Safari'da video kadrlarini
                 yangilamay qo'yishi mumkin (MediaPipe kamera ololmay qoladi).
                 Shuning uchun ekrandan chiqarib, ammo "faol" holatda ushlaymiz. -->
            <video id="input_video" style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;" playsinline></video>
            <canvas id="output_canvas" style="width: 100%; height: auto; transform: scaleX(-1);"></canvas>
            <div id="angle-text">Angle: 0°</div>
        </div>

        <div id="count">0</div>
        <div class="glass-card" id="status" style="text-align: center; color: var(--text-muted);">AI QIDIRILMOQDA...</div>
        
        <button class="neon-btn" id="start-btn" onclick="startGame()">BOSHLASH</button>
        <button class="neon-btn" id="finish-btn" style="display:none;" onclick="endGame()">TUGATISH & SAQLSH</button>
    </div>

    <!-- LEADERBOARD PAGE -->
    <div id="leaderboard" class="page">
        <h2>TOP PLAYERS</h2>
        <div class="glass-card" id="leaderboard-list" style="width: 100%;">
            <!-- Ma'lumotlar JS orqali keladi -->
            <p style="text-align: center; color: #555;">Yuklanmoqda...</p>
        </div>
    </div>

    <!-- NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-link active" id="nav-profile" onclick="showPage('profile', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Men</span>
        </div>
        <div class="nav-link" onclick="showPage('workout', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12M6 17h12M6 7v10M18 7v10M2 12h4M18 12h4"></path></svg>
            <span>Mashg'ulotlar</span>
        </div>
        <div class="nav-link" onclick="showPage('leaderboard', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
            <span>Reyting</span>
        </div>
    </div>

    <!-- MediaPipe Kutubxonalari -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    
    <!-- Ilovaning JS modullari (ES Modules — hammasi js/main.js dan boshlanadi) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
