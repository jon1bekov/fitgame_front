<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuchly</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Telegram API birinchi yuklanishi shart -->
    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- PROFILE PAGE -->
    <div id="profile" class="page active">
        <h2>KUCHLY</h2>
        <div class="character-container">
            <div class="hero" id="game-hero" data-tier="novice">
                <div class="hero__rays"></div>
                <div class="hero__aura"></div>
                <div class="hero__spark hero__spark--1"></div>
                <div class="hero__spark hero__spark--2"></div>
                <div class="hero__spark hero__spark--3"></div>
                <div class="hero__spark hero__spark--4"></div>
                <svg class="hero__svg" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="trunkGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#9a6a3f"/>
                            <stop offset="100%" stop-color="#5c3a1e"/>
                        </linearGradient>
                        <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#7ed957"/>
                            <stop offset="100%" stop-color="#2e9e4f"/>
                        </linearGradient>
                    </defs>

                    <!-- Ildizlar — porlaydi (faqat LEGEND) -->
                    <path class="hero-roots" d="M84,238 Q66,246 54,258" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    <path class="hero-roots" d="M100,240 Q100,252 96,266" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    <path class="hero-roots" d="M116,238 Q134,246 146,258" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>

                    <!-- Gulston (do'kondan tanlangan rang) -->
                    <path class="hero-pot" fill="var(--pot-color)" d="M66,234 L134,234 L124,272 L76,272 Z"/>
                    <rect class="hero-pot" fill="var(--pot-color)" x="60" y="226" width="80" height="14" rx="6"/>
                    <!-- Tuproq -->
                    <ellipse fill="#4a3222" cx="100" cy="234" rx="34" ry="7"/>

                    <!-- O'SUVCHI QISM: daraxtning o'zi — level bo'yicha butunlay masshtabda o'sadi -->
                    <g class="hero-plant">
                        <!-- Tanasi -->
                        <path class="hero-trunk" fill="url(#trunkGrad)" d="M93,234 L93,140 Q93,134 100,134 Q107,134 107,140 L107,234 Z"/>

                        <!-- Bargli tepa qism (bulutsimon "lollipop" shakl) -->
                        <g class="hero-canopy" fill="var(--leaves-color)">
                            <circle cx="100" cy="60" r="27"/>
                            <circle cx="70" cy="82" r="26"/>
                            <circle cx="130" cy="82" r="26"/>
                            <circle cx="85" cy="108" r="24"/>
                            <circle cx="115" cy="108" r="24"/>
                            <circle cx="100" cy="92" r="30"/>
                        </g>

                        <!-- Gullar (WARRIOR va LEGEND) -->
                        <circle class="hero-flowers" fill="var(--flowers-color)" cx="62" cy="78" r="6"/>
                        <circle class="hero-flowers" fill="var(--flowers-color)" cx="138" cy="78" r="6"/>
                        <circle class="hero-flowers" fill="var(--flowers-color)" cx="78" cy="52" r="6"/>
                        <circle class="hero-flowers" fill="var(--flowers-color)" cx="122" cy="52" r="6"/>
                        <circle class="hero-flowers" fill="var(--flowers-color)" cx="100" cy="38" r="6"/>

                        <!-- Porlovchi mevalar (faqat LEGEND) -->
                        <circle class="hero-fruit" cx="75" cy="95" r="5"/>
                        <circle class="hero-fruit" cx="125" cy="95" r="5"/>
                        <circle class="hero-fruit" cx="100" cy="70" r="5"/>
                        <circle class="hero-fruit" cx="88" cy="118" r="5"/>
                        <circle class="hero-fruit" cx="112" cy="118" r="5"/>
                    </g>
                </svg>
            </div>
            <div class="character-stage"></div>
        </div>
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between;">
                <span id="lvl-display">LVL: 01</span>
                <span id="rank-display">RANK: NOVICE</span>
            </div>
            <div class="level-bar"><div class="level-progress" id="progress-bar" style="width: 0%;"></div></div>
            <p id="xp-display">XP: 0 / 1000</p>
            <p id="coins-display" class="coins-display">🪙 0</p>
        </div>
    </div>

    <!-- WORKOUT PAGE (AI KAMERA BILAN) -->
    <div id="workout" class="page">
        <h2>SQUAT MODE</h2>

        <!-- Kamera ko'rinishi -->
        <div class="camera-container">
            <!-- MUHIM TUZATISH: display:none iOS Safari'da video kadrlarini
                 yangilamay qo'yishi mumkin (MediaPipe kamera ololmay qoladi).
                 Shuning uchun ekrandan chiqarib, ammo "faol" holatda ushlaymiz. -->
            <video id="input_video" style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;" playsinline></video>
            <canvas id="output_canvas" style="width: 100%; height: auto; transform: scaleX(-1);"></canvas>
            <div id="angle-text">Angle: 0°</div>
        </div>

        <div id="count">0</div>
        <div class="glass-card" id="status" style="text-align: center; color: var(--text-muted);">AI QIDIRILMOQDA...</div>
        
        <button class="neon-btn" id="start-btn" onclick="startGame()">BOSHLASH</button>
        <button class="neon-btn" id="finish-btn" style="display:none;" onclick="endGame()">TUGATISH & SAQLSH</button>
    </div>

    <!-- LEADERBOARD PAGE -->
    <div id="leaderboard" class="page">
        <h2>TOP PLAYERS</h2>
        <div class="glass-card" id="leaderboard-list" style="width: 100%;">
            <!-- Ma'lumotlar JS orqali keladi -->
            <p style="text-align: center; color: #555;">Yuklanmoqda...</p>
        </div>
    </div>

    <!-- SHOP PAGE -->
    <div id="shop" class="page">
        <h2>DO'KON</h2>
        <p id="shop-coins" class="coins-display" style="margin-bottom: 12px;">🪙 0</p>
        <div id="shop-list" style="width: 100%;">
            <p style="text-align: center; color: #555;">Yuklanmoqda...</p>
        </div>
    </div>

    <!-- NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-link active" id="nav-profile" onclick="showPage('profile', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Men</span>
        </div>
        <div class="nav-link" onclick="showPage('workout', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12M6 17h12M6 7v10M18 7v10M2 12h4M18 12h4"></path></svg>
            <span>Mashg'ulotlar</span>
        </div>
        <div class="nav-link" onclick="showPage('leaderboard', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
            <span>Reyting</span>
        </div>
        <div class="nav-link" onclick="showPage('shop', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            <span>Do'kon</span>
        </div>
    </div>

    <!-- MediaPipe Kutubxonalari -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    
    <!-- Ilovaning JS modullari (ES Modules — hammasi js/main.js dan boshlanadi) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
