<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitGame AI</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Telegram API birinchi yuklanishi shart -->
    <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- PROFILE PAGE -->
    <div id="profile" class="page active">
        <h2>FITGAME PLAYER</h2>
        <div class="character-container">
            <div class="hero" id="game-hero" data-tier="novice">
                <div class="hero__rays"></div>
                <div class="hero__aura"></div>
                <div class="hero__spark hero__spark--1"></div>
                <div class="hero__spark hero__spark--2"></div>
                <div class="hero__spark hero__spark--3"></div>
                <div class="hero__spark hero__spark--4"></div>
                <svg class="hero__svg" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#ffd9b3"/>
                            <stop offset="100%" stop-color="#f0b586"/>
                        </linearGradient>
                        <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#5b3a29"/>
                            <stop offset="100%" stop-color="#3b2418"/>
                        </linearGradient>
                    </defs>

                    <!-- Plash (faqat LEGEND) -->
                    <path class="hero-cape hero-cape--left" d="M66,104 Q40,160 54,240 Q70,204 76,150 Z"/>
                    <path class="hero-cape hero-cape--right" d="M134,104 Q160,160 146,240 Q130,204 124,150 Z"/>

                    <!-- Oyoqlar (teri) -->
                    <path class="hero-leg" fill="url(#skinGrad)" d="M78,210 L96,210 L94,252 L80,252 Z"/>
                    <path class="hero-leg" fill="url(#skinGrad)" d="M122,210 L104,210 L106,252 L120,252 Z"/>
                    <!-- Yalang oyoq (NOVICE, standart) -->
                    <ellipse class="hero-foot" fill="url(#skinGrad)" cx="82" cy="258" rx="15" ry="8"/>
                    <ellipse class="hero-foot" fill="url(#skinGrad)" cx="118" cy="258" rx="15" ry="8"/>
                    <!-- Krossovka (FIGHTER dan boshlab, yalang oyoqni yopadi) -->
                    <rect class="hero-shoe" fill="var(--shoes-color)" x="66" y="250" width="32" height="15" rx="7"/>
                    <rect class="hero-shoe" fill="var(--shoes-color)" x="102" y="250" width="32" height="15" rx="7"/>

                    <!-- Shim (do'kondan tanlangan rang) -->
                    <path class="hero-shorts" fill="var(--shorts-color)" d="M72,180 L128,180 L124,214 L104,214 L100,200 L96,214 L76,214 Z"/>

                    <!-- Qo'llar (teri) -->
                    <path class="hero-arm hero-arm--left" fill="url(#skinGrad)" d="M66,110 Q46,132 44,178 Q43,189 53,189 Q61,189 60,178 Q62,140 78,116 Z"/>
                    <path class="hero-arm hero-arm--right" fill="url(#skinGrad)" d="M134,110 Q154,132 156,178 Q157,189 147,189 Q139,189 140,178 Q138,140 122,116 Z"/>
                    <circle class="hero-fist" fill="url(#skinGrad)" cx="48" cy="183" r="10"/>
                    <circle class="hero-fist" fill="url(#skinGrad)" cx="152" cy="183" r="10"/>
                    <!-- Bilaguzuklar (FIGHTER dan boshlab) -->
                    <rect class="hero-armor" x="40" y="173" width="16" height="6" rx="3"/>
                    <rect class="hero-armor" x="144" y="173" width="16" height="6" rx="3"/>

                    <!-- Futbolka (do'kondan tanlangan rang) -->
                    <path class="hero-torso" fill="var(--shirt-color)" d="M64,112 Q64,102 76,102 L124,102 Q136,102 136,112 L130,182 Q129,192 118,192 L82,192 Q71,192 70,182 Z"/>
                    <!-- Sport jaketi/vest (WARRIOR va LEGEND) -->
                    <path class="hero-chestplate" d="M78,106 L122,106 L118,150 L100,158 L82,150 Z"/>
                    <!-- Kubok — chempionlik belgisi (faqat LEGEND) -->
                    <g class="hero-weapon">
                        <path d="M142,146 Q142,132 152,132 L162,132 Q172,132 172,146 Q172,156 162,158 L152,158 Q142,156 142,146 Z"/>
                        <rect x="154" y="158" width="8" height="10"/>
                        <rect x="148" y="168" width="20" height="6" rx="2"/>
                    </g>

                    <!-- Bo'yin -->
                    <rect class="hero-neck" fill="url(#skinGrad)" x="90" y="100" width="20" height="14" rx="4"/>

                    <!-- Soch (orqa qism, boshdan oldin chiziladi) -->
                    <path class="hero-hair-back" fill="url(#hairGrad)" d="M56,66 Q50,18 100,14 Q150,18 144,66 Q150,54 146,40 Q132,16 100,16 Q68,16 54,40 Q50,54 56,66 Z"/>
                    <!-- Quloqlar -->
                    <ellipse fill="url(#skinGrad)" cx="58" cy="68" rx="7" ry="10"/>
                    <ellipse fill="url(#skinGrad)" cx="142" cy="68" rx="7" ry="10"/>
                    <!-- Bosh (yuz) -->
                    <circle class="hero-head" fill="url(#skinGrad)" cx="100" cy="64" r="40"/>
                    <!-- Qoshlar -->
                    <rect fill="url(#hairGrad)" x="74" y="58" width="16" height="4" rx="2"/>
                    <rect fill="url(#hairGrad)" x="110" y="58" width="16" height="4" rx="2"/>
                    <!-- Ko'zlar -->
                    <circle fill="#ffffff" cx="82" cy="70" r="8"/>
                    <circle fill="#3b6dc4" cx="82" cy="70" r="4.6"/>
                    <circle fill="#ffffff" cx="80" cy="68" r="1.6"/>
                    <circle fill="#ffffff" cx="118" cy="70" r="8"/>
                    <circle fill="#3b6dc4" cx="118" cy="70" r="4.6"/>
                    <circle fill="#ffffff" cx="116" cy="68" r="1.6"/>
                    <!-- Qizarish (lunj) -->
                    <circle fill="#ff9e9e" opacity="0.55" cx="70" cy="84" r="6"/>
                    <circle fill="#ff9e9e" opacity="0.55" cx="130" cy="84" r="6"/>
                    <!-- Tabassum -->
                    <path fill="none" stroke="#7a4a33" stroke-width="3" stroke-linecap="round" d="M90,92 Q100,99 110,92"/>
                    <!-- Peshonabog' (WARRIOR va LEGEND) -->
                    <rect class="hero-headband" x="68" y="44" width="64" height="8" rx="4"/>
                    <!-- Soch (old qism, peshona ustida) -->
                    <path class="hero-hair-front" fill="url(#hairGrad)" d="M60,48 Q66,20 100,18 Q134,20 140,48 Q128,28 100,28 Q72,28 60,48 Z"/>
                    <!-- Toj (faqat LEGEND) -->
                    <path class="hero-crown" d="M78,10 L86,22 L100,6 L114,22 L122,10 L118,26 L82,26 Z"/>
                </svg>
            </div>
            <div class="character-stage"></div>
        </div>
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between;">
                <span id="lvl-display">LVL: 01</span>
                <span id="rank-display">RANK: NOVICE</span>
            </div>
            <div class="level-bar"><div class="level-progress" id="progress-bar" style="width: 0%;"></div></div>
            <p id="xp-display">XP: 0 / 1000</p>
            <p id="coins-display" class="coins-display">🪙 0</p>
        </div>
    </div>

    <!-- WORKOUT PAGE (AI KAMERA BILAN) -->
    <div id="workout" class="page">
        <h2>SQUAT MODE</h2>

        <!-- Kamera ko'rinishi -->
        <div class="camera-container">
            <!-- MUHIM TUZATISH: display:none iOS Safari'da video kadrlarini
                 yangilamay qo'yishi mumkin (MediaPipe kamera ololmay qoladi).
                 Shuning uchun ekrandan chiqarib, ammo "faol" holatda ushlaymiz. -->
            <video id="input_video" style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;" playsinline></video>
            <canvas id="output_canvas" style="width: 100%; height: auto; transform: scaleX(-1);"></canvas>
            <div id="angle-text">Angle: 0°</div>
        </div>

        <div id="count">0</div>
        <div class="glass-card" id="status" style="text-align: center; color: var(--text-muted);">AI QIDIRILMOQDA...</div>
        
        <button class="neon-btn" id="start-btn" onclick="startGame()">BOSHLASH</button>
        <button class="neon-btn" id="finish-btn" style="display:none;" onclick="endGame()">TUGATISH & SAQLSH</button>
    </div>

    <!-- LEADERBOARD PAGE -->
    <div id="leaderboard" class="page">
        <h2>TOP PLAYERS</h2>
        <div class="glass-card" id="leaderboard-list" style="width: 100%;">
            <!-- Ma'lumotlar JS orqali keladi -->
            <p style="text-align: center; color: #555;">Yuklanmoqda...</p>
        </div>
    </div>

    <!-- SHOP PAGE -->
    <div id="shop" class="page">
        <h2>DO'KON</h2>
        <p id="shop-coins" class="coins-display" style="margin-bottom: 12px;">🪙 0</p>
        <div id="shop-list" style="width: 100%;">
            <p style="text-align: center; color: #555;">Yuklanmoqda...</p>
        </div>
    </div>

    <!-- NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-link active" id="nav-profile" onclick="showPage('profile', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Men</span>
        </div>
        <div class="nav-link" onclick="showPage('workout', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12M6 17h12M6 7v10M18 7v10M2 12h4M18 12h4"></path></svg>
            <span>Mashg'ulotlar</span>
        </div>
        <div class="nav-link" onclick="showPage('leaderboard', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
            <span>Reyting</span>
        </div>
        <div class="nav-link" onclick="showPage('shop', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            <span>Do'kon</span>
        </div>
    </div>

    <!-- MediaPipe Kutubxonalari -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    
    <!-- Ilovaning JS modullari (ES Modules — hammasi js/main.js dan boshlanadi) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
